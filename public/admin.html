<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração - Aulas</title>
<style>
  :root {
    --tinta: #1c2733;
    --papel: #f5f3ee;
    --linha: #d9d4c7;
    --laranja: #d9591f;
    --suave: #5d6772;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Arial, sans-serif; background: var(--papel); color: var(--tinta); line-height: 1.5; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { margin: 0 0 18px; font-size: 1.7rem; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .box { background: #fff; border: 1px solid var(--linha); border-radius: 6px; padding: 16px; margin-bottom: 22px; }
  label { display: block; margin: 10px 0 4px; font-size: .9rem; }
  input, textarea, select {
    width: 100%; font: inherit; padding: 10px; border: 1px solid var(--linha); border-radius: 4px; background: #fff;
  }
  textarea { min-height: 80px; resize: vertical; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 4px; background: var(--laranja); color: #fff; padding: 10px 16px; }
  button.sec { background: transparent; color: var(--tinta); border: 1px solid var(--linha); }
  button.perigo { background: transparent; color: #a3201a; border: 1px solid #e3b9b6; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
  .linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .linha input { flex: 1; min-width: 180px; }
  #msg { min-height: 1.4em; margin: 10px 0; color: #a3201a; }
  #msg.ok { color: #1d6b3a; }
  #painel { display: none; }
  .item { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--linha); flex-wrap: wrap; }
  .item:first-child { border-top: 0; }
  .item small { color: var(--suave); display: block; }
  .botoes { display: flex; gap: 8px; }
  .vazio { color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>Administração</h1>
  <div id="msg" role="status"></div>

  <section id="login" class="box">
    <h2>Entrar</h2>
    <div class="linha">
      <input id="chave" type="password" placeholder="Chave de administrador" autocomplete="current-password">
      <button id="btnEntrar">Entrar</button>
    </div>
  </section>

  <div id="painel">
    <section class="box">
      <h2 id="tituloForm">Novo curso</h2>
      <label for="titulo">Título</label>
      <input id="titulo">
      <label for="descricao">Descrição</label>
      <textarea id="descricao"></textarea>
      <label for="nivel">Nível</label>
      <input id="nivel" placeholder="Ex.: Iniciante, Intermédio">
      <label for="preco">Preço em Kz</label>
      <input id="preco" inputmode="decimal" placeholder="Ex.: 15000">
      <div class="linha" style="margin-top:14px">
        <button id="btnGuardar">Adicionar curso</button>
        <button id="btnCancelar" class="sec" style="display:none">Cancelar edição</button>
      </div>
    </section>

    <section class="box">
      <h2>Cursos publicados</h2>
      <div id="cursos" class="vazio">A carregar...</div>
    </section>

    <section class="box">
      <h2>Pedidos recebidos</h2>
      <div id="pedidos" class="vazio">A carregar...</div>
    </section>
  </div>
</main>

<script>
  const API = "";
  let CHAVE = "";
  let cursos = [];
  let editando = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const kz = v => Number(v).toLocaleString("pt-AO", { maximumFractionDigits: 2 }) + " Kz";

  function msg(t, ok) { const m = $("msg"); m.textContent = t; m.className = ok ? "ok" : ""; }

  function cabecalhos() {
    return { "Content-Type": "application/json", "x-token": CHAVE };
  }

  function lerPreco(t) {
    let s = String(t).trim().replace(/\s/g, "").replace(/Kz/i, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = Number(s);
    return isNaN(n) ? NaN : n;
  }

  async function pedir(caminho, metodo, corpo) {
    const r = await fetch(API + caminho, {
      method: metodo || "GET",
      headers: cabecalhos(),
      body: corpo ? JSON.stringify(corpo) : undefined
    });
    return r;
  }

  async function entrar() {
    CHAVE = $("chave").value.trim();
    if (!CHAVE) { msg("Escreve a chave."); return; }
    try {
      const r = await pedir("/api/verificar");
      if (r.status === 401) { msg("Chave incorreta."); CHAVE = ""; return; }
      if (!r.ok) { msg("O servidor respondeu com erro " + r.status + "."); CHAVE = ""; return; }
      msg("");
      $("login").style.display = "none";
      $("painel").style.display = "block";
      carregar();
    } catch (e) {
      msg("Não consegui acessar a API. Tenta outra vez dentro de um minuto.");
    }
  }

  async function carregar() {
    try {
      const r = await fetch(API + "/api/cursos");
      cursos = await r.json();
      $("cursos").className = "";
      $("cursos").innerHTML = cursos.length ? cursos.map(c => `
        <div class="item">
          <div>
            <strong>${esc(c.titulo)}</strong>
            <small>${esc(c.nivel)} - ${kz(c.preco)}</small>
          </div>
          <div class="botoes">
            <button class="sec" data-acao="editar" data-id="${c.id}">Editar</button>
            <button class="perigo" data-acao="apagar" data-id="${c.id}">Apagar</button>
          </div>
        </div>`).join("") : '<span class="vazio">Ainda não há cursos. Adiciona o primeiro acima.</span>';
    } catch (e) {
      $("cursos").textContent = "Não foi possível carregar os cursos.";
    }
    carregarPedidos();
  }

  async function carregarPedidos() {
    try {
      const r = await pedir("/api/pedidos");
      if (!r.ok) throw new Error();
      const ps = await r.json();
      $("pedidos").className = "";
      $("pedidos").innerHTML = ps.length ? ps.map(p => {
        const c = cursos.find(x => x.id === p.curso_id);
        return `<div class="item"><div>
          <strong>${esc(p.nome_cliente)}</strong>
          <small>${esc(p.telefone)} - ${esc(c ? c.titulo : "curso " + p.curso_id)}</small>
        </div></div>`;
      }).join("") : '<span class="vazio">Ainda não há pedidos.</span>';
    } catch (e) {
      $("pedidos").textContent = "Não foi possível carregar os pedidos.";
    }
  }

  function limparForm() {
    editando = null;
    ["titulo", "descricao", "nivel", "preco"].forEach(i => $(i).value = "");
    $("tituloForm").textContent = "Novo curso";
    $("btnGuardar").textContent = "Adicionar curso";
    $("btnCancelar").style.display = "none";
  }

  async function guardar() {
    const preco = lerPreco($("preco").value);
    const dados = {
      titulo: $("titulo").value.trim(),
      descricao: $("descricao").value.trim(),
      nivel: $("nivel").value.trim(),
      preco
    };
    if (!dados.titulo) { msg("Escreve o título do curso."); return; }
    if (isNaN(preco)) { msg("Preço inválido. Escreve só números, por exemplo 15000."); return; }
    try {
      const r = editando
        ? await pedir("/api/cursos/" + editando, "PUT", dados)
        : await pedir("/api/cursos", "POST", dados);
      if (r.status === 401) { msg("Chave incorreta."); return; }
      if (!r.ok) { msg("Não foi possível guardar (erro " + r.status + ")."); return; }
      msg(editando ? "Curso atualizado." : "Curso adicionado.", true);
      limparForm();
      carregar();
    } catch (e) {
      msg("Não consegui acessar a API.");
    }
  }

  async function apagar(id) {
    if (!confirm("Apagar este curso do catálogo?")) return;
    try {
      const r = await pedir("/api/cursos/" + id, "DELETE");
      if (!r.ok) { msg("Não foi possível apagar (erro " + r.status + ")."); return; }
      msg("Curso apagado.", true);
      carregar();
    } catch (e) {
      msg("Não consegui acessar a API.");
    }
  }

  $("btnEntrar").onclick = entrar;
  $("chave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
  $("btnGuardar").onclick = guardar;
  $("btnCancelar").onclick = limparForm;

  $("cursos").addEventListener("click", e => {
    const b = e.target.closest("button[data-acao]");
    if (!b) return;
    const id = Number(b.dataset.id);
    if (b.dataset.acao === "apagar") return apagar(id);
    const c = cursos.find(x => x.id === id);
    if (!c) return;
    editando = id;
    $("titulo").value = c.titulo || "";
    $("descricao").value = c.descricao || "";
    $("nivel").value = c.nivel || "";
    $("preco").value = c.preco ?? "";
    $("tituloForm").textContent = "Editar curso";
    $("btnGuardar").textContent = "Guardar alterações";
    $("btnCancelar").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>
</html>
