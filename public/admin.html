<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin - Produtos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef3fb; margin: 0; padding: 24px; }
    h1 { color: #2b2d5b; }
    .box { background: white; border-radius: 12px; padding: 16px; margin-bottom: 24px;
           box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .box h3 { width: 100%; margin: 0; color: #2b2d5b; }
    input { padding: 10px; border: 1px solid #ccd3e0; border-radius: 8px; font-size: 14px; }
    #nome { flex: 1; min-width: 180px; }
    #preco { width: 140px; }
    #catalogo { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; width: 220px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .card h3 { margin: 0 0 8px; color: #2b2d5b; }
    .card p { margin: 0 0 12px; font-size: 18px; }
    .botoes { display: flex; gap: 8px; }
    .btn { border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .editar { background: #3b6fd4; }
    .excluir { background: #d64545; }
    .add { background: #2b2d5b; }
    #msg { color: #c0392b; }
    #painel { display: none; }
  </style>
</head>
<body>
  <h1>Administração</h1>

  <div class="box" id="login">
    <h3>Entrar</h3>
    <input id="chave" type="password" placeholder="Chave de administrador">
    <button class="btn add" onclick="entrar()">Entrar</button>
  </div>
  <p id="msg"></p>

  <div id="painel">
    <div class="box">
      <h3>Adicionar produto</h3>
      <input id="nome" type="text" placeholder="Nome do produto">
      <input id="preco" type="text" placeholder="Preço em Kz">
      <button class="btn add" onclick="adicionar()">Adicionar</button>
    </div>
    <div id="catalogo"></div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000"; // trocar pelo endereço do Render
    let CHAVE = "";
    let produtos = [];

    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    const kz = v => Number(v).toLocaleString("pt-AO",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Kz";

    function lerPreco(texto) {
      let t = String(texto).trim().replace(/\s/g, "").replace(/Kz/i, "");
      if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
      return parseFloat(t);
    }

    function cabecalhos() {
      return { "Content-Type": "application/json", "X-Admin-Key": CHAVE };
    }

    function msg(t) { document.getElementById("msg").textContent = t; }

    async function entrar() {
      CHAVE = document.getElementById("chave").value;
      try {
        const r = await fetch(API + "/verificar", { headers: cabecalhos() });
        if (!r.ok) { msg("Chave incorreta."); CHAVE = ""; return; }
        msg("");
        document.getElementById("login").style.display = "none";
        document.getElementById("painel").style.display = "block";
        carregar();
      } catch (e) {
        msg("Não consegui acessar a API.");
      }
    }

    async function carregar() {
      const r = await fetch(API + "/produtos");
      produtos = await r.json();
      document.getElementById("catalogo").innerHTML = produtos.map(p => `
        <div class="card">
          <h3>${esc(p.nome)}</h3>
          <p>${kz(p.preco)}</p>
          <div class="botoes">
            <button class="btn editar" onclick="editar(${p.id})">Editar</button>
            <button class="btn excluir" onclick="excluir(${p.id})">Excluir</button>
          </div>
        </div>`).join("");
    }

    async function enviar(url, metodo, corpo) {
      const r = await fetch(API + url, {
        method: metodo, headers: cabecalhos(),
        body: corpo ? JSON.stringify(corpo) : undefined
      });
      if (r.status === 401) { msg("Sessão inválida. Recarregue e entre de novo."); return false; }
      if (!r.ok) { msg("Erro ao salvar."); return false; }
      msg("");
      return true;
    }

    async function adicionar() {
      const nome = document.getElementById("nome").value.trim();
      const preco = lerPreco(document.getElementById("preco").value);
      if (!nome || isNaN(preco)) { alert("Preencha o nome e um preço válido."); return; }
      if (await enviar("/produtos", "POST", { nome, preco })) {
        document.getElementById("nome").value = "";
        document.getElementById("preco").value = "";
        carregar();
      }
    }

    async function editar(id) {
      const p = produtos.find(x => x.id === id);
      const nome = prompt("Novo nome:", p.nome);
      if (nome === null) return;
      const texto = prompt("Novo preço em Kz:", p.preco);
      if (texto === null) return;
      const preco = lerPreco(texto);
      if (isNaN(preco)) { alert("Preço inválido."); return; }
      if (await enviar("/produtos/" + id, "PUT", { nome, preco })) carregar();
    }

    async function excluir(id) {
      if (!confirm("Excluir este produto?")) return;
      if (await enviar("/produtos/" + id, "DELETE")) carregar();
    }
  </script>
</body>
</html>
