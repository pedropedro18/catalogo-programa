<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Cursos</title>
  <style>
    :root {
      --tinta: #1c2733;
      --papel: #f5f3ee;
      --linha: #d9d4c7;
      --laranja: #d9591f;
      --suave: #5d6772;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: var(--papel); color: var(--tinta); line-height: 1.5; }
    main { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { margin: 0 0 6px; font-size: 1.8rem; }
    .sub { margin: 0 0 22px; color: var(--suave); }
    #erro { color: #a3201a; min-height: 1.4em; }

    nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    nav a { text-decoration: none; color: var(--tinta); border: 1px solid var(--linha); background: #fff;
            border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
    nav a:hover { border-color: var(--laranja); color: var(--laranja); }

    .niveis { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
    .niveis button { font: inherit; font-size: .9rem; cursor: pointer; border: 1px solid var(--linha);
                     background: #fff; color: var(--tinta); border-radius: 6px; padding: 8px 16px; }
    .niveis button[aria-pressed="true"] { background: var(--laranja); border-color: var(--laranja); color: #fff; }
    .niveis button:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
    .vazio { color: var(--suave); margin-top: 24px; }

    section.categoria { margin-top: 30px; scroll-margin-top: 12px; }
    section.categoria h2 { font-size: 1.25rem; margin: 0 0 12px; padding-bottom: 6px;
                           border-bottom: 2px solid var(--laranja); display: inline-block; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

    .card { background: #fff; border: 1px solid var(--linha); border-radius: 8px; padding: 18px;
            display: flex; flex-direction: column; }
    .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .nivel { align-self: flex-start; font-size: .78rem; color: var(--laranja); border: 1px solid var(--laranja);
             border-radius: 999px; padding: 1px 10px; margin-bottom: 10px; }
    .card p.desc { margin: 0 0 12px; font-size: .95rem; color: var(--suave); flex: 1; }
    .preco { margin: 0 0 12px; font-size: 1.1rem; font-weight: 700; }
    .zap { background: #25d366; color: #fff; padding: 10px 14px; border-radius: 6px; text-decoration: none;
           font-size: .95rem; text-align: center; }
    .zap:hover { background: #1fb858; }
    .zap:focus-visible, nav a:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <h1>Nossos cursos</h1>
  <p class="sub">Escolhe a categoria e o nível. O pedido é feito pelo WhatsApp.</p>
  <p id="erro" role="status"></p>
  <div class="niveis" id="niveis" role="group" aria-label="Nível"></div>
  <nav id="menu" aria-label="Categorias"></nav>
  <div id="catalogo"></div>
</main>

<script>
  const WHATSAPP = "244923030010";
  const ORDEM_CATEGORIAS = ["Excel", "Word", "Python", "HTML", "Inglês"];
  const ORDEM_NIVEIS = ["Iniciante", "Intermédio", "Avançado"];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const kz = v => Number(v).toLocaleString("pt-AO",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Kz";

  const pos = (lista, valor) => { const i = lista.indexOf(valor); return i === -1 ? lista.length : i; };
  const slug = s => "cat-" + s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");

  function cartao(c) {
    const msg = encodeURIComponent(
      "Quero o curso: " + c.titulo + (c.nivel ? " (" + c.nivel + ")" : "") + " - " + kz(c.preco)
    );
    return `<div class="card">
      <h3>${esc(c.titulo)}</h3>
      ${c.nivel ? `<span class="nivel">${esc(c.nivel)}</span>` : ""}
      <p class="desc">${esc(c.descricao)}</p>
      <p class="preco">${kz(c.preco)}</p>
      <a class="zap" href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank" rel="noopener">Pedir no WhatsApp</a>
    </div>`;
  }

  let todos = [];
  let nivelAtivo = "";

  function desenharNiveis() {
    const opcoes = [["", "Todos os níveis"], ...ORDEM_NIVEIS.map(n => [n, n])];
    document.getElementById("niveis").innerHTML = opcoes.map(([v, t]) =>
      `<button type="button" data-nivel="${esc(v)}" aria-pressed="${v === nivelAtivo}">${esc(t)}</button>`
    ).join("");
  }

  function desenhar() {
    const div = document.getElementById("catalogo");
    const menu = document.getElementById("menu");
    const cursos = nivelAtivo ? todos.filter(c => c.nivel === nivelAtivo) : todos;

    if (!cursos.length) {
      menu.innerHTML = "";
      div.innerHTML = '<p class="vazio">Não há cursos neste nível.</p>';
      return;
    }

    const grupos = {};
    cursos.forEach(c => {
      const cat = c.categoria || "Outros";
      (grupos[cat] = grupos[cat] || []).push(c);
    });

    const nomes = Object.keys(grupos).sort((a, b) => {
      if (a === "Outros") return 1;
      if (b === "Outros") return -1;
      const d = pos(ORDEM_CATEGORIAS, a) - pos(ORDEM_CATEGORIAS, b);
      return d !== 0 ? d : a.localeCompare(b, "pt");
    });

    menu.innerHTML = nomes.map(n => `<a href="#${slug(n)}">${esc(n)}</a>`).join("");

    div.innerHTML = nomes.map(nome => {
      const lista = grupos[nome].sort((a, b) => pos(ORDEM_NIVEIS, a.nivel) - pos(ORDEM_NIVEIS, b.nivel));
      return `<section class="categoria" id="${slug(nome)}">
        <h2>${esc(nome)}</h2>
        <div class="grade">${lista.map(cartao).join("")}</div>
      </section>`;
    }).join("");
  }

  document.getElementById("niveis").addEventListener("click", e => {
    const b = e.target.closest("button[data-nivel]");
    if (!b) return;
    nivelAtivo = b.dataset.nivel;
    desenharNiveis();
    desenhar();
  });

  async function carregar() {
    try {
      const r = await fetch("/api/cursos");
      if (!r.ok) throw new Error(r.status);
      todos = await r.json();
      if (!todos.length) {
        document.getElementById("catalogo").innerHTML = "<p>Ainda não há cursos publicados.</p>";
        return;
      }
      desenharNiveis();
      desenhar();
    } catch (e) {
      document.getElementById("erro").textContent = "Não foi possível carregar os cursos.";
    }
  }
  carregar();
</script>
</body>
</html>
