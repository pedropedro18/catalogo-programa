<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Cursos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef3fb; margin: 0; padding: 24px; }
    h1 { color: #2b2d5b; }
    #catalogo { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; width: 220px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .card h3 { margin: 0 0 4px; color: #2b2d5b; }
    .card small { display: block; margin-bottom: 8px; color: #666; }
    .card p { margin: 0 0 12px; font-size: 16px; }
    .zap { background: #25d366; color: white; padding: 8px 14px; border-radius: 8px;
           text-decoration: none; font-size: 14px; display: inline-block; }
    #erro { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Nossos cursos</h1>
  <p id="erro"></p>
  <div id="catalogo"></div>

  <script>
    const WHATSAPP = "244923030010";

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    const kz = v => Number(v).toLocaleString("pt-AO",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Kz";

    async function carregar() {
      const div = document.getElementById("catalogo");
      try {
        const r = await fetch("/api/cursos");
        if (!r.ok) throw new Error(r.status);
        const cursos = (await r.json()).filter(c => c.ativo);
        if (!cursos.length) {
          div.innerHTML = "<p>Ainda não há cursos publicados.</p>";
          return;
        }
        div.innerHTML = cursos.map(c => {
          const msg = encodeURIComponent("Quero o curso: " + c.titulo + " (" + kz(c.preco) + ")");
          return `<div class="card">
            <h3>${esc(c.titulo)}</h3>
            <small>${esc(c.nivel)}</small>
            <p>${esc(c.descricao)}</p>
            <p><b>${kz(c.preco)}</b></p>
            <a class="zap" href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank">Pedir no WhatsApp</a>
          </div>`;
        }).join("");
      } catch (e) {
        document.getElementById("erro").textContent = "Não foi possível carregar os cursos.";
      }
    }
    carregar();
  </script>
</body>
</html>
